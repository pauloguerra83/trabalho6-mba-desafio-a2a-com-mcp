[project]
name = "a-ponte"
version = "1.0.0"
description = "Servidor MCP de salas e agente A2A que o consome por dentro"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "pydantic==2.14.0",
    "starlette==1.7.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["servidor-mcp", "agente"]
